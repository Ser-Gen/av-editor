<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />
    <!--
      favicon.png is the same artwork rasterized at 32px, for browsers that do not take an
      SVG icon (Safari before 16.4). Redraw the SVG and it needs redrawing too. Declaring
      either one also stops the browser asking for /favicon.ico.
    -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <title>AWw Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
